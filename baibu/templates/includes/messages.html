{% if messages %}
  <div class="mx-auto mt-4 w-full max-w-3xl px-4" role="status">
    {% for message in messages %}
      <p class="mb-2 rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-brand/20 bg-brand-soft text-stone-900{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
