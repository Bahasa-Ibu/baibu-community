[project]
name = "baibu-community"
version = "0.1.0"
description = "Baibu Community Edition: self-hostable platform for community language data and local-language chat"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PT Ibu Punya Mimpi", email = "contact@baibu.id" }]
requires-python = "==3.14.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "celery==5.4.0",
    "django==5.2.7",
    "django-allauth[mfa]>=65.12,<66",
    "django-environ==0.12.0",
    "django-redis==6.0.0",
    "django-storages[s3]==1.14.6",
    "gunicorn==23.0.0",
    "hiredis==3.3.0",
    "litellm==1.104.0",
    "polib==1.2.0",
    "psycopg[binary]==3.2.10",
    "redis==6.4.0",
    "whitenoise==6.11.0",
]

[dependency-groups]
dev = [
    "coverage==7.10.7",
    "django-coverage-plugin==3.2.0",
    "factory-boy==3.3.2",
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "ruff==0.14.0",
]

[tool.uv]
package = false

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = ["tests.py", "test_*.py"]

# ==== Coverage ====
[tool.coverage.run]
include = ["baibu/**", "config/**"]
omit = ["*/migrations/*", "*/tests/*", "config/settings/local.py", "config/settings/production.py", "config/wsgi.py"]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ==== ruff ====
[tool.ruff]
target-version = "py314"
line-length = 119
extend-exclude = ["*/migrations/*.py", "staticfiles/*"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I", "N", "UP", "S", "BLE", "FBT", "B", "A", "C4", "DTZ", "DJ", "PIE", "T20", "PT", "RET", "SIM", "PTH", "ERA", "PL", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "RUF012",  # mutable class attributes on Django Meta/admin
    "PLR2004", # magic values in tests
    "PLC0415", # deferred imports are normal in Django (AppConfig.ready, signals)
    "SIM102",  # nested ifs are sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S106", "PLR0913"]

[tool.ruff.lint.isort]
force-single-line = true
