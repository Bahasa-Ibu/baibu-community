name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real personal data, contributor
        text, secrets or API keys anywhere in this issue. Report security problems
        privately to contact@baibu.id, as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up --build`
        2. Open http://localhost:8000/...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts, consent or deletion requests
        - Submissions
        - Chat
        - Staff tools
        - Localization
        - Infrastructure, Docker or CI
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit hash or release you are running (`git rev-parse --short HEAD`).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, browser, and anything else that may matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove personal data and secrets before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This issue contains no personal data, contributor text or secrets.
          required: true
