name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: baibu
          POSTGRES_PASSWORD: baibu
          POSTGRES_DB: baibu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baibu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://baibu:baibu@localhost:5432/baibu
      # The storage tests also run against an S3-compatible server.
      S3_TEST_ENDPOINT_URL: http://localhost:8333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install GNU gettext (translation source extraction)
        run: command -v xgettext || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext)
      - name: Start an S3-compatible server (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:3.97 server -s3 -dir=/data -ip.bind=0.0.0.0
          timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:8333/; do sleep 1; done'
      - name: Check for missing migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests with coverage
        run: |
          uv run --frozen coverage run -m pytest -q
          uv run --frozen coverage report
          uv run --frozen coverage html -d htmlcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --target production -f compose/django/Dockerfile .
